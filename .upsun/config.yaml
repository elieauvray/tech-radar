# Upsun configuration for the Tech Radar.
# A Node.js (Express) server serves the `docs/` front end and the
# `/api/technologies` endpoint, backed by a PostgreSQL service.
applications:
  tech-radar:
    type: 'nodejs:22'

    build:
      flavor: none

    relationships:
      database:
        service: database
        endpoint: postgresql

    hooks:
      build: |
        set -e
        npm ci --omit=dev
      # Create the schema (idempotent), then seed it only if the table is empty.
      deploy: |
        set -e
        node db/migrate.js
        node db/seed.js

    web:
      commands:
        start: node server/index.js
      locations:
        '/':
          passthru: true
          headers:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff

services:
  database:
    type: 'postgresql:16'

routes:
  "https://{default}/":
    type: upstream
    upstream: "tech-radar:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
