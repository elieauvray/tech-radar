<svg xmlns="http://www.w3.org/2000/svg" width="198" height="39" viewBox="0 0 198 39" role="img" aria-label="Société Générale">
  <title>Société Générale</title>
  <!-- Simplified Société Générale mark: red square over black square with a white bar -->
