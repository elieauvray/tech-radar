  <circle cx="18" cy="17" r="7" fill="#c6f03c"/>
  <rect x="7" y="22" width="22" height="3" rx="1.5" fill="#ffffff"/>
  <!-- Wordmark -->
  <text x="46" y="26" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="1" fill="#ffffff">UPSUN</text>
</svg>
